# Looyer pre-commit hooks, adapted from adap-modules/.pre-commit-config.yaml.
# Changes from the original: Odoo parts removed (pylint-odoo, isort --project=odoo,
# check-xml); pylint runs in the project's pipenv env so imports resolve; JSON check,
# merge-conflict, large-file and private-key checks added.
#
# Setup once (from the repo root):
#   pipenv install --dev
#   pipenv run pre-commit install
# Run on every file:
#   pipenv run pre-commit run --all-files

default_language_version:
  python: python3.11

# Generated or vendored files: never reformat them
exclude: |
  (?x)^(
    graphify-out/|
    components/evaluator/(runs|index_checks)/|
    llm-server/|
    docs/design\.svg$
  )

repos:
  # 1. Import sorting (same style as black)
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=120"]

  # 2. Code formatting
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: [--line-length=120]

  # 3. Lint. Local hook: runs in the project's pipenv env, so llama_index, qdrant_client etc.
  #    can be imported (an isolated hook env would report import-error everywhere).
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pipenv run pylint
        language: system
        types: [python]
        # settings: [tool.pylint.*] in pyproject.toml

  # 4. General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-symlinks
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # 5. Security scan (high severity only)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (Security Check)
        args: [-lll]
